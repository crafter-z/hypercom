[package]
name = "hypercom"
version = "0.6.8"
description = "A modern serial port debugging tool built with Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "hypercom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "~2.10.1"
tauri-plugin-process = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 串口通信
serialport = "4"

# 伪终端（模拟终端 git bash pty，issue #11；Windows = ConPTY，无需 feature）
portable-pty = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 日志
log = { version = "0.4", features = ["std"] }
encoding_rs = "0.8"

# 目录
dirs = "5"

# 错误处理
thiserror = "1"
anyhow = "1"

# 系统监控
sysinfo = "0.33"

# 工具
uuid = { version = "1", features = ["v4"] }

# 背景图 data URL 编码（issue #13）
base64 = "0.22"

# 更新客户端：系统代理、SOCKS 与插件共享同一 reqwest 版本。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy", "socks"] }
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
parking_lot = "0.12"
url = "2"
tauri-plugin-clipboard-manager = "2"

# 插件 URL 白名单 glob → 正则（issue #17；regex 是 reqwest 传递依赖，显式声明）
regex = "1"

# 插件 HTTP 流式读响应体（issue #17；reqwest bytes_stream 需要）
futures-util = "0.3"

# 插件 zip 安装解压（issue #17）。默认 features——我们只解压（deflate/stored），
# 但裁剪 features 会触发整棵依赖树重新求解、扰动既有 lock（曾致 capabilities
# ACL 漂移的误诊），故不裁剪、接受多余压缩后端编译成本。
zip = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
