[package]
name = "hypercom"
version = "0.6.5"
description = "A modern serial port debugging tool built with Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "hypercom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 串口通信
serialport = "4"

# 伪终端（模拟终端 git bash pty，issue #11；Windows = ConPTY，无需 feature）
portable-pty = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 日志
log = { version = "0.4", features = ["std"] }
encoding_rs = "0.8"

# 目录
dirs = "5"

# 错误处理
thiserror = "1"
anyhow = "1"

# 系统监控
sysinfo = "0.33"

# 工具
uuid = { version = "1", features = ["v4"] }

# 背景图 data URL 编码（issue #13）
base64 = "0.22"

# 自动更新：GitHub API 解析 preview 通道（issue #12）；版本对齐 tauri-plugin-updater 自带 reqwest
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
