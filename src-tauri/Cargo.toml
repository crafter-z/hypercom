[package]
name = "hypercom"
version = "0.1.0"
description = "A modern serial port debugging tool built with Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "hypercom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 串口通信
serialport = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 日志
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"

# 目录
dirs = "5"

# 错误处理
thiserror = "1"
anyhow = "1"

# 系统监控
sysinfo = "0.33"

# 工具
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
