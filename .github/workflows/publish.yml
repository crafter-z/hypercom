name: 'publish'

on:
  push:
    tags:
      - 'v*'
      - '!v*-preview*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable tag to verify (vX.Y.Z)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releaseId: ${{ steps.prepare.outputs.releaseId }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: release gate behavior tests
        run: node --test scripts/release.test.mjs
      - name: Validate tag, versions and notes; prepare one draft
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs prepare stable "$RELEASE_TAG"

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: install frontend dependencies
        run: npm ci
      - name: frontend checks (tsc + vitest)
        shell: bash
        run: |
          npx tsc --noEmit
          npm run test:run
      - name: cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.releaseId }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  finalize-release:
    name: verify signatures and write complete manifest (leave draft)
    needs: [prepare-release, publish-tauri]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Gate all matrix results; verify and upload latest.json once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.releaseId }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          MATRIX_RESULT: ${{ needs.publish-tauri.result }}
        run: node scripts/release.mjs finalize stable "$RELEASE_TAG" "$RELEASE_ID"

  verify-release:
    name: supplementary read-only published release verification
    if: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Use current verifier code even when an older tag predates the gate;
      # obtain its updater key from the explicitly selected release source.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: released-source
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Verify published assets with the release's updater key
        working-directory: released-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node ../scripts/release.mjs verify stable "$RELEASE_TAG"
