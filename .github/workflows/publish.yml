name: 'publish'

on:
  push:
    tags:
      # issue #12：preview tag（v*-preview*）由 publish-preview.yml 专属负责。
      # GitHub Actions 不允许同一事件同时使用 tags 与 tags-ignore（配置解析失败
      # 会变成「普通 push 也触发 + 0s workflow file issue」）——排除必须用
      # 同一过滤器内的 `!` 否定模式（顺序敏感，否定项放在最后）。
      - 'v*'
      - '!v*-preview*'
  # issue #12 二轮门禁修正：verify 必须等 release **published** 后跑——
  # draft release 的资产任何身份都取不到（releases/download/ 匿名 404、协作者
  # PAT 404、GITHUB_TOKEN 调 releases API 也 401），push 阶段矩阵构建到 draft
  # 时无法验证 latest.json。发布动作（release: published）触发独立 verify job。
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish-tauri:
    # 仅在 tag push 时构建——published/dispatch 事件只跑 verify，不触发矩阵重建
    # （否则发布 draft 会立刻对已发布 release 做一次多余重建）。
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      # issue #12 二轮发版护栏①：质量门——发版构建必须先过类型/单测门禁。
      - name: frontend checks (tsc + vitest)
        shell: bash
        run: |
          npx tsc --noEmit
          npm run test:run

      - name: cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # issue #12 二轮发版护栏②：RELEASE_NOTES 顶部章节必须与版本一致——
      # 忘加新章节/误留旧章节时 awk 会静默抓上一版 notes 写进 release 描述
      # 与 latest.json（updater 弹窗文案），此处显式 fail。
      - name: verify release notes match version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NOTES_VERSION=$(grep -m1 '^# HyperCom v' RELEASE_NOTES.md | sed 's/^# HyperCom v//' | tr -d '[:space:]')
          if [ "$VERSION" != "$NOTES_VERSION" ]; then
            echo "::error::RELEASE_NOTES.md 顶部章节 v$NOTES_VERSION 与 tauri.conf.json 版本 $VERSION 不一致——发版前确认已新增本版本章节"
            exit 1
          fi

      - name: read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            # 只取顶部**当前版本**章节（截至下一个 `# HyperCom v` 头之前）：
            # RELEASE_NOTES.md 是累积式（新章节加在顶部、旧版本保留），`cat` 全文件
            # 会把所有历史版本都带进 release 描述与 updater 弹窗（见
            # docs/architecture/release.md「Release notes 与 updater 弹窗文案」）。
            awk '/^# HyperCom /{n++} n <= 1 {print} n > 1 {exit}' RELEASE_NOTES.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'HyperCom v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # issue #12 复审：tauri-action 默认 false → MSI+NSIS 并存时 latest.json
          # 的 Windows 块指向 MSI。更新链路按 NSIS `/UPDATE` 流程设计与验收
          # （plugins.updater.windows.installMode=passive，installer 等应用退出再
          # 替换文件并自重启）——必须显式优先 NSIS（docs/architecture/update.md 关键事实 #3）。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # issue #12 二轮发版护栏③：latest.json 全平台键完整性门禁。
  # 矩阵部分失败（fail-fast:false）时 tauri-action 逐 job 覆盖 latest.json，
  # 会产出**缺平台键**的清单——该平台 check() 直接报错（docs/architecture/update.md 关键事实 #1）。
  # 此 job 把静默损坏变成显式红叉。
  #
  # 触发时点修正（实测）：draft release 的资产**任何身份都取不到**——匿名
  # releases/download/ 404、协作者 PAT 也 404、GITHUB_TOKEN 调 releases API 401。
  # push（构建到 draft）阶段无法验证，verify 必须等 release **published** 事件
  # （发布后资产公开，匿名 curl 即可）或 workflow_dispatch 手动重跑。
  verify-release:
    name: verify latest.json integrity
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: verify latest.json platform keys
        shell: bash
        run: |
          # release published 事件：tag_name 即 v<version>；workflow_dispatch 兜底
          # 从 tauri.conf.json 取版本。release 已发布 → 资产公开可匿名下载。
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          URL="https://github.com/crafter-z/hypercom/releases/download/v$VERSION/latest.json"
          echo "checking $URL"
          curl -fsSL "$URL" -o latest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const version = process.argv[1];
            const errors = [];
            if (j.version !== version) errors.push("version mismatch: " + j.version + " != " + version);
            const required = ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"];
            for (const key of required) {
              const p = j.platforms && j.platforms[key];
              if (!p) { errors.push("missing platform key: " + key); continue; }
              if (!p.url) errors.push(key + ": missing url");
              if (!p.signature) errors.push(key + ": missing signature");
            }
            if (errors.length) {
              console.error("latest.json integrity check FAILED:");
              for (const e of errors) console.error("  - " + e);
              console.error("重跑失败的矩阵 job 或人工补齐 release 资产后重新触发本 workflow。");
              process.exit(1);
            }
            console.log("latest.json integrity OK: all platform keys present with url+signature");
          ' "$VERSION"
