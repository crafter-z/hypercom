name: 'ci'

# 统一质量门：日常 CI 与发版流（publish.yml / publish-preview.yml）共用此工作流。
# 日常触发 push / PR / 手动运行；发版流通过 workflow_call 在创建 draft 前调用同一套
# tsc + vitest + release tests + production build + Rust test/clippy/release check + Playwright。
# 这样 tag 发布不会绕过日常质量门，也不会维护两份容易漂移的检查清单。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

# 同一 PR 的旧运行被新提交取代；分支上的 push 不取消，避免发布前门禁被中断。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck (application + tooling + e2e)
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.node.json
          npx tsc --noEmit -p tsconfig.e2e.json

      - name: unit tests (vitest)
        run: npm run test:run

      - name: release gate behavior tests
        run: node --test scripts/release.test.mjs

      # `build` = `tsc && vite build`，也是 tauri.conf.json 的 beforeBuildCommand。
      # 发版流只在 tag 上跑 tauri 打包；平时的 bundling/resolution 错误（如新增依赖
      # 未正确 externalize）没人拦，这里用同一命令提前兜住。
      - name: production build (vite build)
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 与发版流的清单一致；唯一差异是 appindicator：发版流跑 ubuntu-22.04 用
          # libappindicator3-dev，而 ubuntu-latest(24.04) 只保留继任者
          # libayatana-appindicator3-dev（libappindicator-sys 优先探测
          # ayatana-appindicator3-0.1，两者提供同一 pkg-config 依赖）。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri-build 在 test profile 下仍会读 tauri.conf.json，前端依赖先就位
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # --lib 在 Linux 上会执行 #[cfg(not(target_os = "windows"))] 的串口/TTY 测试，
      # Windows 本地开发环境跑不到——把 Windows-only 之外的分支纳入回归是本 job 的目的。
      - name: cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      # `cargo check` 默认只在 debug profile 编译，`cfg(not(debug_assertions))` 与
      # release 专属路径（如 updater 的真实 endpoint）平时永远不编译；发版前必须
      # 在 release profile 上过一遍类型检查。
      - name: cargo check (release)
        run: cargo check --release --lib --manifest-path src-tauri/Cargo.toml

  e2e:
    name: e2e (playwright chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # e2e specs use mock IPC (injecting window.__TAURI_INTERNALS__), so Rust and
      # webkit2gtk are not needed; playwright.config.ts starts the Vite dev server
      # (1420) itself, with reuseExistingServer=false in CI. Each mock throws for
      # unknown commands so missing coverage cannot silently return null.
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: playwright test
        run: npx playwright test
