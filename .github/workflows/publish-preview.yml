name: 'publish-preview'

# issue #12：preview 发版流（每版本独立唯一 tag，如 v0.6.0-preview.1）
#
# 与 stable publish.yml 的差异：
# - 触发：tag 匹配 v*-preview*（stable 流已用 `!v*-preview*` 否定排除，两流互不干扰）
# - releaseDraft: false —— preview release 必须立即可见（GitHub API 解析依赖
#   它出现在 /releases 列表；draft 不进列表，`find_latest_preview_tag` 也过滤掉）
# - prerelease: true —— 从 GitHub「latest」解析中排除，stable 用户永不见 preview
# - tagName: v__VERSION__ —— 沿用 tauri-action 的版本占位符；发版前三文件版本
#   同步为 0.x.y-preview.N 即生成唯一 tag（绝不重复使用 tag）
#
# 产物与 stable 基本相同（AppImage/dmg + .sig + latest.json）；Windows 例外：
# 只打 NSIS（MSI/WiX 只接受数字版本，semver pre-release 版本打包直接报错，
# 见下方 Windows 矩阵项注释），同一把 minisign 私钥签名；manifest notes
# 同样来自 RELEASE_NOTES.md 顶部当前章节。

on:
  push:
    tags:
      - 'v*-preview*'

jobs:
  publish-preview-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # issue #12 preview：Windows 只打 NSIS——MSI（WiX）只接受数字版本，
            # `0.6.0-preview.N` 的 pre-release 段非数字，bundler 直接拒绝打包；
            # 更新链路 latest.json Windows 块本就走 NSIS（updaterJsonPreferNsis），
            # MSI 对 preview 仅是手动安装件，跳过零损失；stable 流保持 MSI+NSIS。
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      # issue #12 二轮发版护栏①②：与 stable 流同款——质量门 + notes↔版本校验
      # （preview 章节头 `# HyperCom vX.Y.Z-preview.N`，同样必须与版本一致）。
      - name: frontend checks (tsc + vitest)
        shell: bash
        run: |
          npx tsc --noEmit
          npm run test:run

      - name: cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: verify release notes match version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NOTES_VERSION=$(grep -m1 '^# HyperCom v' RELEASE_NOTES.md | sed 's/^# HyperCom v//' | tr -d '[:space:]')
          if [ "$VERSION" != "$NOTES_VERSION" ]; then
            echo "::error::RELEASE_NOTES.md 顶部章节 v$NOTES_VERSION 与 tauri.conf.json 版本 $VERSION 不一致——preview 发版前确认已新增本版本章节"
            exit 1
          fi

      - name: read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            # 与 stable 流同款：只取顶部**当前版本**章节（preview 章节头为
            # `# HyperCom v0.6.0-preview.1`，同样命中 `^# HyperCom ` 前缀）。
            awk '/^# HyperCom /{n++} n <= 1 {print} n > 1 {exit}' RELEASE_NOTES.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 每版独立唯一 tag（发版前版本号三处写 0.x.y-preview.N 即生成）。
          # 绝不复用 tag：prerelease release 会被 GitHub「latest」排除，也无法通过
          # 共用 endpoint 被 stable 用户拿到，唯一 tag 是 preview 通道的寻址基础。
          tagName: v__VERSION__
          releaseName: 'HyperCom v__VERSION__ (preview)'
          releaseBody: ${{ steps.notes.outputs.body }}
          # 必须立即发布（非 draft）：GitHub API /releases 列表与 updater 的
          # tag-pinned URL 都需要已发布状态；draft 不在 /releases 中。
          releaseDraft: false
          # 关键：标记 prerelease —— ① 从 releases/latest 解析排除（stable 通道
          # 零污染）；② 前端 API 解析按 prerelease 筛选（见 commands/update.rs）。
          prerelease: true
          # issue #12 复审：与 stable 流同款——latest.json Windows 块优先 NSIS
          # （tauri-action 默认 false 会指向 MSI，偏离 NSIS /UPDATE 验收路径）。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # issue #12 二轮发版护栏③：latest.json 全平台键完整性门禁（与 stable 流同款）。
  # 矩阵部分失败（fail-fast:false）会产出缺平台键的清单 → 该平台 check() 报错。
  verify-release:
    name: verify latest.json integrity
    needs: publish-preview-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: verify latest.json platform keys
        shell: bash
        run: |
          # preview 流 releaseDraft: false——push 后资产立即公开，匿名 curl 即可
          # （preview.2 发布已验证该路径）；GITHUB_TOKEN 在 draft 下 401、在已发布
          # 下也无必要，保持匿名最简。
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          URL="https://github.com/crafter-z/hypercom/releases/download/v$VERSION/latest.json"
          echo "checking $URL"
          curl -fsSL "$URL" -o latest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const version = process.argv[1];
            const errors = [];
            if (j.version !== version) errors.push("version mismatch: " + j.version + " != " + version);
            const required = ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"];
            for (const key of required) {
              const p = j.platforms && j.platforms[key];
              if (!p) { errors.push("missing platform key: " + key); continue; }
              if (!p.url) errors.push(key + ": missing url");
              if (!p.signature) errors.push(key + ": missing signature");
            }
            if (errors.length) {
              console.error("latest.json integrity check FAILED:");
              for (const e of errors) console.error("  - " + e);
              console.error("重跑失败的矩阵 job 或人工补齐 release 资产后重新触发本 workflow。");
              process.exit(1);
            }
            console.log("latest.json integrity OK: all platform keys present with url+signature");
          ' "$VERSION"